name: Deploy Move packages to github packages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]
  pull_request:
    branches: [ master ]

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # cache: npm
          # registry-url: https://npm.pkg.github.com/
      - name: Install dependencies
        run: npm install
      - name: Setup Aptos CLI
        uses: WGB5445/aptos-cli-setup@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: "7.5.0"
      - name: Build Move Packages
        run: aptos move build --included-artifacts none --save-metadata --named-addresses test=0x11075e54838a4f97e5af4141b08c0e0bccb7b1d57b36757bc62539ee97342008
      # - name: SyncPackageJson
      #   run: npx ts-node ghscripts/sync_package_json.ts
      - name: Publish Move Packages
        run: npx ts-node ghscripts/publish.ts
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
